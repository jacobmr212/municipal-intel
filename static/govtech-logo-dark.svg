    <circle cx="62" cy="46" r="3" fill="#1a3a2a"/>
    <circle cx="36" cy="60" r="3" fill="#1a3a2a"/>
    <circle cx="10" cy="46" r="3" fill="#1a3a2a"/>
    <circle cx="10" cy="16" r="3" fill="#1a3a2a"/>
