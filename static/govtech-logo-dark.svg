    <line x1="36" y1="-1" x2="36" y2="-8" stroke="#1a3a2a" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
    <line x1="65" y1="14" x2="70" y2="10" stroke="#1a3a2a" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
    <line x1="65" y1="48" x2="70" y2="52" stroke="#1a3a2a" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
    <line x1="36" y1="63" x2="36" y2="70" stroke="#1a3a2a" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
    <line x1="7" y1="48" x2="2" y2="52" stroke="#1a3a2a" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
    <line x1="7" y1="14" x2="2" y2="10" stroke="#1a3a2a" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  </g>
